<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>十六站 · 预览</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  body:not(.preview) #bar, body:not(.preview) #drop { display: none; }
  body:not(.preview) canvas { display: block; }
  #stage { position: absolute; inset: 0 0 92px 0; display: flex; align-items: center; justify-content: center; }
  #stage canvas { max-width: 100%; max-height: 100%; width: auto !important; height: auto !important; aspect-ratio: 16 / 9; box-shadow: 0 0 40px #000; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 92px; background: #1b1b1b; border-top: 1px solid #333; padding: 8px 16px; box-sizing: border-box; }
  #bar .row { display: flex; align-items: center; gap: 12px; height: 36px; }
  #seek { flex: 1; accent-color: #d8262e; }
  button, input[type=number] { background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 5px 10px; font: inherit; }
  button:hover { background: #333; }
  input[type=number] { width: 80px; }
  #station { font-weight: 600; color: #fff; min-width: 300px; }
  #time, #beat, #fps { font-variant-numeric: tabular-nums; color: #aaa; }
  #beat { min-width: 56px; }
  #metro { width: 14px; height: 14px; border-radius: 50%; background: #ffd24d; opacity: .15; }
  #drop { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 28px; background: rgba(216,38,46,.25); border: 4px dashed #d8262e; pointer-events: none; }
  #drop.on { display: flex; }
  label { color: #999; }
  .spacer { flex: 1; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="drop">松开即载入音频（只用于对拍，不保存）</div>
<div id="bar">
  <div class="row">
    <button id="play">▶ 播放</button>
    <button id="prev" title="后退一帧（←，Shift+← 后退 1 秒）">◀︎</button>
    <button id="next" title="前进一帧（→，Shift+→ 前进 1 秒）">▶︎</button>
    <input id="seek" type="range" min="0" max="77.48" step="0.0166" value="0">
    <span id="time">0:00.00</span>
  </div>
  <div class="row">
    <span id="metro" title="节拍灯：红色是每小节强拍"></span>
    <span id="beat">1:1</span>
    <span id="station">Intro</span>
    <span class="spacer"></span>
    <label>音频 <input id="audioFile" type="file" accept="audio/*" style="width:180px"></label>
    <span id="audioName">（也可以直接把音频文件拖进窗口）</span>
    <label>FIRST_DOWNBEAT <input id="offset" type="number" step="0.01" min="0"></label>
    <label>BPM <input id="bpm" type="number" step="0.1" min="40"></label>
    <button id="resetGrid" title="恢复 src/beat/config.js 里的值">还原</button>
    <span id="fps"></span>
  </div>
</div>
<script src="preview/lib/p5.min.js"></script>
<script src="preview/lib/p5.brush.standalone.js"></script>
<script src="preview/build/fonts.js"></script>
<script src="preview/build/heads.js"></script>
<script src="preview/build/bundle.js"></script>
</body>
</html>
